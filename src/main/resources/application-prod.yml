spring:
  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

logging:
  level:
    com.mesaayuda: INFO

# Sin default: si no se configuró el origen real del frontend desplegado, el
# arranque debe fallar explícitamente en vez de quedar restringido a
# localhost en producción.
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS}

spring:
  application:
    name: mesa-ayuda

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:mesa_ayuda}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

security:
  jwt:
    secret: ${JWT_SECRET}
    access-token-expiracion-minutos: 15
    refresh-token-expiracion-dias: 7

sla:
  escalamiento:
    umbral-minutos: ${SLA_ESCALAMIENTO_UMBRAL_MINUTOS:30}
    cron: ${SLA_ESCALAMIENTO_CRON:0 */5 * * * *}
  notificacion:
    remitente: mesa-ayuda@localhost

server:
  port: ${PORT:8080}

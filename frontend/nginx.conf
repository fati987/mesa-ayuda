# El ruteo de react-router-dom es client-side: sin este fallback, refrescar
# la página en una ruta como /tickets/ABC-123 daría un 404 de nginx en vez
# de dejar que la SPA resuelva la ruta.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri /index.html;
    }
}

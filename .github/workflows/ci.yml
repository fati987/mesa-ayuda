name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # ubuntu-latest ya trae Docker preinstalado y corriendo (/var/run/docker.sock),
      # Testcontainers lo detecta sin configuración adicional. Esta es la corrida
      # real que certifica que la batería de tests con Testcontainers pasa completa.
      - name: Verify (tests con Testcontainers)
        run: ./mvnw -B verify

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build (type-check incluido)
        run: npm run build

  docker:
    needs: backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Solo valida que la imagen construye; no se publica a ningún registro.
      - name: Build backend image
        run: docker build -t mesa-ayuda:ci .
